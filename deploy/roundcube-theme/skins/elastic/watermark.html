<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title></title>
<!-- Team Gene: empty reading pane (no message, contact or setting selected).
     Replaces Elastic's washed-out Roundcube logo with the Team Gene mark. -->
<style type="text/css">
:root { --paper: #fffefb; --ring: rgba(30, 77, 65, .28); --clay: #c97b55; --ink: #1e4d41; --text: #1d2f29; --muted: #6b7a72; }
html.dark-mode { --paper: #0f1a16; --ring: rgba(213, 224, 218, .22); --clay: #e9a882; --ink: #d5e0da; --text: #d5e0da; --muted: #8fa199; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--paper);
  color: var(--text);
  font-family: Inter, Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  text-align: center;
}
.mark { width: 88px; height: 88px; }
.mark .ring { stroke: var(--ring); }
.mark .orbit { stroke: var(--clay); }
.mark .g { fill: var(--ink); }
p { margin: 0; }
.name { margin-top: 18px; font-size: 15px; font-weight: 600; letter-spacing: .08em; }
.hint { margin-top: 6px; font-size: 13px; color: var(--muted); }
@media (max-height: 260px) { .mark { width: 56px; height: 56px; } .hint { display: none; } }
</style>
<script>
  try {
    if (document.cookie.indexOf('colorMode=dark') > -1
      || (document.cookie.indexOf('colorMode=light') === -1 && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.className += ' dark-mode';
    }
  } catch (e) { }
</script>
</head>
